<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ratings | Sword & Board</title>

    <!-- ========================================
       FILE: ratings.html
       PURPOSE: Guest ratings page for Sword & Board.
                Allows visitors to leave a room rating,
                select a room, and submit comments.
       ======================================== -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- External stylesheets -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/raven.css" />
    <link rel="stylesheet" href="css/ratings.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <!-- ========================================
       SECTION: Navigation Header
       PURPOSE: Main site navigation.
       ======================================== -->
    <header>
      <nav class="container">
        <div class="logo">Sword &amp; Board</div>
        <button class="hamburger" aria-label="Toggle navigation">☰</button>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="events/events.html">Events</a>
          <a href="rooms/rangersroost.html">Ranger's Roost</a>
          <a href="rooms/wizardstower.html">Wizard's Tower</a>
          <a href="calculator.html">Calculator</a>
          <a href="contacts.html">Contact</a>
          <a href="ratings.html">Ratings</a>
        </div>
      </nav>
    </header>

    <!-- ========================================
       SECTION: Ratings Form
       PURPOSE: Allows guests to leave a room rating
                and share comments about their stay.
       ======================================== -->
    <section class="container">
      <div class="parchment-scroll">
        <div class="ratings-card">
          <h2>Leave a Rating</h2>

          <form id="ratingForm" class="raven-form">
            <label for="guestName">Name:</label>
            <input type="text" id="guestName" name="guestName" />

            <label for="roomRated">Room:</label>
            <select id="roomRated" name="roomRated">
              <option value="wizard">The Wizard's Tower</option>
              <option value="ranger">Ranger's Roost</option>
            </select>

            <label>Rating:</label>
            <div class="star-rating">
              <span data-value="5">★</span>
              <span data-value="4">★</span>
              <span data-value="3">★</span>
              <span data-value="2">★</span>
              <span data-value="1">★</span>
            </div>

            <input type="hidden" id="rating" name="rating" />

            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments"></textarea>

            <button type="submit" class="scroll-btn">
              Submit Your Tale ⚔️
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- ========================================
       SECTION: Footer
       PURPOSE: Simple site footer.
       ======================================== -->
    <footer>
      <p>&copy; 2026 Sword &amp; Board B&amp;B. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/ratings.js"></script>
  </body>
</html>
